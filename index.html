<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TKtodo">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme:dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>TKtodo</title>
<meta name="build" content="20261019-0320">
<style>
  :root{
    --bg:#f5f5f7;
    --card:#ffffff;
    --fg:#111114;
    --mute:#8a8a90;
    --line:#ebebef;
    --over:#d9363e;
    --btn:#111114;
    --btn-fg:#ffffff;
    --dim:#5c5c64;
    --pill:#f0f0f4;
    --pill-fg:#3c3c44;
    --soon-bg:#fcf0dd;
    --soon-fg:#955700;
    --over-bg:#fbe5e6;
    --over-fg:#c0292f;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000;
      --card:#151517;
      --fg:#f2f2f4;
      --mute:#8a8a90;
      --line:#2b2b30;
      --over:#ff5f5f;
      --btn:#f2f2f4;
      --btn-fg:#0b0b0d;
      --dim:#b4b4bc;
      --pill:#26262b;
      --pill-fg:#e8e8ec;
      --soon-bg:#302619;
      --soon-fg:#f2b862;
      --over-bg:#331a1c;
      --over-fg:#ff8585;
    }
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    padding:calc(env(safe-area-inset-top, 0px) + 32px) 16px calc(env(safe-area-inset-bottom, 0px) + 32px);
    background:var(--bg); color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  main{
    margin:auto;
    width:100%;
    max-width:500px;
  }
  h1{
    margin:0 0 22px;
    text-align:center;
    font-size:21px;
    font-weight:700;
    letter-spacing:.5px;
  }

  /* ---------- 输入卡片 ---------- */
  form{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:0 18px 16px;
  }
  #t{
    display:block; width:100%;
    font:inherit; font-size:18px; font-weight:600; color:inherit;
    text-align:center;
    background:none; border:0; outline:none;
    padding:18px 0 16px;
    min-height:56px;
    -webkit-appearance:none; appearance:none;
  }
  #t::placeholder{ color:var(--mute); font-weight:400; }
  #t:focus::placeholder{ opacity:.45; }

  .line{ height:1px; background:var(--line); }

  .row2{
    display:flex; flex-wrap:wrap; gap:10px;
    align-items:center; justify-content:center;
    padding-top:16px;
  }
  #d{
    font:inherit; font-size:16px; color:inherit;
    text-align:center;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:12px;
    padding:0 14px; min-height:44px;
    outline:none;
  }
  #d:focus{ border-color:var(--fg); }

  button{
    font:inherit; font-size:15px; font-weight:500;
    min-height:44px; padding:0 18px;
    border:0; border-radius:12px; cursor:pointer;
    background:var(--btn); color:var(--btn-fg);
  }
  button:active{ opacity:.62; }
  button:disabled{ opacity:.35; cursor:default; }
  .ghost{ background:none; color:var(--mute); border:1px solid var(--line); }
  .danger{ color:var(--over); }

  /* ---------- 列表卡片 ---------- */
  ul{ list-style:none; margin:0; padding:0; }

  #list{
    margin-top:14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:2px 18px;
  }
  .row{
    display:flex; align-items:center; gap:10px;
    padding:13px 0; border-top:1px solid var(--line); cursor:pointer;
  }
  #list .row:first-child{ border-top:0; }

  .check{
    flex:0 0 40px; width:40px; height:40px; min-height:40px;
    margin:-7px -8px -7px -10px; padding:0;
    background:none; border:0; border-radius:0;
    display:flex; align-items:center; justify-content:center;
  }
  .check i{
    width:21px; height:21px; border-radius:50%;
    border:1.5px solid var(--mute);
    display:flex; align-items:center; justify-content:center;
    transition:background .15s, border-color .15s;
  }
  .check.on i{ background:var(--fg); border-color:var(--fg); }
  .check.on i::after{
    content:""; width:4px; height:8px;
    border:solid var(--card); border-width:0 2px 2px 0;
    transform:rotate(45deg) translate(-1px,-1px);
  }

  .txt{ flex:1; min-width:0; }
  .title{ font-size:16px; word-break:break-word; }
  .meta{ display:flex; align-items:center; gap:8px; margin-top:5px; font-size:14px; color:var(--mute); }
  .due{ font-variant-numeric:tabular-nums; font-weight:500; color:var(--dim); }
  .left{
    display:inline-flex; align-items:center;
    padding:1px 8px 2px; border-radius:999px;
    font-size:12.5px; font-weight:600; line-height:1.5;
    background:var(--pill); color:var(--pill-fg);
  }
  .soon .left{ background:var(--soon-bg); color:var(--soon-fg); }
  .over .left{ background:var(--over-bg); color:var(--over-fg); }
  .over .due{ color:var(--over); }
  .done .title{ color:var(--mute); text-decoration:line-through; }

  .cal{
    flex:0 0 40px; width:40px; height:40px; min-height:40px;
    margin:-7px -10px -7px 0; padding:0;
    background:none; border:0; border-radius:0;
    color:var(--mute);
    display:flex; align-items:center; justify-content:center;
  }
  .cal:active{ opacity:.5; }

  /* ---------- 就地编辑 ---------- */
  .row.editing{ cursor:default; }
  .editor{
    width:100%;
    display:flex; flex-direction:column; gap:8px;
    animation:slideIn .18s ease-out;
  }
  @keyframes slideIn{
    from{ opacity:0; transform:translateY(-6px); }
    to{ opacity:1; transform:none; }
  }
  .editor input{
    font:inherit; font-size:16px; color:inherit; width:100%;
    background:var(--bg);
    border:1px solid var(--line); border-radius:11px;
    padding:0 12px; min-height:44px; outline:none;
  }
  .editor input:focus{ border-color:var(--fg); }
  .eacts{ display:flex; align-items:center; gap:8px; }
  .eacts .spacer{ flex:1; }
  .eacts button{ min-height:38px; font-size:14px; padding:0 14px; border-radius:10px; }

  .empty{
    text-align:center; color:var(--mute);
    padding:34px 0; font-size:14px;
  }

  /* ---------- 日历工具条 ---------- */
  .tools{
    margin-top:12px;
    display:flex; align-items:center; justify-content:center;
    flex-wrap:wrap; gap:8px;
    font-size:14px; color:var(--mute);
  }
  .tools select, .tools input{
    font:inherit; font-size:16px; color:var(--fg);
    background:var(--bg);
    border:1px solid var(--line); border-radius:10px;
    padding:0 8px; min-height:36px; outline:none;
  }
  .tools select:focus, .tools input:focus{ border-color:var(--fg); }
  #cn{ width:58px; text-align:center; }
  #all{ font-size:14px; min-height:36px; padding:0 14px; border-radius:10px; }

  /* ---------- 已完成 ---------- */
  details{
    margin-top:14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:0 18px 2px;
  }
  summary{
    list-style:none; cursor:pointer; user-select:none;
    text-align:center; font-size:13px; color:var(--mute);
    padding:15px 0;
  }
  summary::-webkit-details-marker{ display:none; }
  #clearDone{
    display:block; margin:4px auto 14px;
    font-size:13px; min-height:34px; padding:0 14px; border-radius:9px;
  }

  /* ---------- 提示 ---------- */
  #toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom, 0px) + 80px);
    transform:translateX(-50%);
    max-width:min(88vw,420px);
    background:#1c1c1f; color:#f4f4f6;
    font-size:14px; line-height:1.45;
    padding:11px 16px; border-radius:12px;
    box-shadow:0 6px 24px rgba(0,0,0,.22);
    z-index:9; text-align:center; white-space:pre-line;
  }
  @media (prefers-color-scheme: dark){
    #toast{ background:#f2f2f4; color:#101012; }
  }

  /* ---------- 检查更新 ---------- */
  .foot{ margin-top:20px; text-align:center; }
  .link{
    background:none; border:0; padding:6px 12px;
    font:inherit; font-size:13px; color:var(--mute);
    cursor:pointer; text-decoration:underline; text-underline-offset:3px;
  }
  .link:active{ opacity:.55; }
  .link:disabled{ opacity:.55; cursor:default; }
  .link.has-new{
    color:var(--fg); font-weight:600; text-decoration:none;
  }
  .link.has-new::before{
    content:""; display:inline-block;
    width:7px; height:7px; border-radius:50%;
    background:#ff3b30; margin-right:7px; vertical-align:1px;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 50%{ opacity:.3; } }

  /* 底部固定的新版本横条 */
  #updBar{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom, 0px) + 18px);
    display:flex; align-items:center; gap:12px;
    background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:9px 10px 9px 16px;
    box-shadow:0 8px 28px rgba(0,0,0,.18);
    font-size:14px; color:var(--fg);
    z-index:8; white-space:nowrap;
  }
  #updBar::before{
    content:""; width:7px; height:7px; border-radius:50%;
    background:#ff3b30; animation:pulse 1.6s ease-in-out infinite;
  }
  #updGo{ min-height:36px; font-size:14px; padding:0 14px; border-radius:10px; }
</style>
</head>
<body>
<main>
  <h1>TKtodo</h1>
  <form id="f" autocomplete="off">
    <input id="t" type="text" placeholder="做什么…" aria-label="任务">
    <div class="line"></div>
    <div class="row2">
      <input id="d" type="datetime-local" aria-label="截止时间">
      <button id="b" type="submit">添加</button>
    </div>
  </form>

  <ul id="list"></ul>

  <div class="tools">
    <span>提醒</span>
    <select id="off" aria-label="提前多久提醒">
      <option value="0">不提醒</option>
      <option value="15">提前 15 分钟</option>
      <option value="30">提前 30 分钟</option>
      <option value="60">提前 1 小时</option>
      <option value="180">提前 3 小时</option>
      <option value="1440">提前 1 天</option>
      <option value="2880">提前 2 天</option>
      <option value="4320">提前 3 天</option>
      <option value="custom">自定义…</option>
    </select>
    <span id="custom" hidden>
      <input id="cn" type="number" min="1" max="999" inputmode="numeric" value="6" aria-label="数量">
      <select id="cu" aria-label="单位">
        <option value="1">分钟前</option>
        <option value="60" selected>小时前</option>
        <option value="1440">天前</option>
      </select>
    </span>
    <button id="all" class="ghost" type="button">全部导入日历</button>
  </div>

  <details id="doneBox" hidden>
    <summary id="summary"></summary>
    <ul id="doneList"></ul>
    <button id="clearDone" class="ghost danger" type="button">清空已完成</button>
  </details>

  <div class="foot">
    <button id="upd" class="link" type="button">检查更新</button>
  </div>

  <div id="updBar" hidden>
    <span>有新版本</span>
    <button id="updGo" type="button">立即更新</button>
  </div>

  <div id="toast" hidden></div>
</main>

<script>
(() => {
  const KEY = 'ddl.v1';
  const OFF_KEY = 'ddl.off.v1';
  const $ = s => document.querySelector(s);
  const f = $('#f'), t = $('#t'), d = $('#d'), b = $('#b');
  const list = $('#list'), doneBox = $('#doneBox'), doneList = $('#doneList'), summary = $('#summary');
  const clearBtn = $('#clearDone');
  const selOff = $('#off'), customBox = $('#custom'), cn = $('#cn'), cu = $('#cu'), allBtn = $('#all');
  const toastEl = $('#toast');

  let items = [];
  try {
    const parsed = JSON.parse(localStorage.getItem(KEY) || '[]');
    if (Array.isArray(parsed)) items = parsed;
  } catch (e) {}

  let offMin = 1440;
  try {
    const v = parseInt(localStorage.getItem(OFF_KEY), 10);
    if (Number.isFinite(v) && v >= 0) offMin = v;
  } catch (e) {}

  let editing = null;
  let toastTimer = 0;

  const PRESETS = [0, 15, 30, 60, 180, 1440, 2880, 4320];

  const save = () => localStorage.setItem(KEY, JSON.stringify(items));
  const saveOff = () => localStorage.setItem(OFF_KEY, String(offMin));
  const pad = n => String(n).padStart(2, '0');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const uid = () => (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.hidden = true; }, 4200);
  }

  function toInput(ms) {
    const x = new Date(ms);
    return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}T${pad(x.getHours())}:${pad(x.getMinutes())}`;
  }

  function defaultDue() {
    const x = new Date();
    x.setHours(18, 0, 0, 0);
    if (x.getTime() <= Date.now()) x.setDate(x.getDate() + 1);
    return toInput(x.getTime());
  }

  function fmt(ms) {
    const x = new Date(ms);
    const md = `${pad(x.getMonth() + 1)}-${pad(x.getDate())} ${pad(x.getHours())}:${pad(x.getMinutes())}`;
    return x.getFullYear() === new Date().getFullYear() ? md : `${x.getFullYear()}-${md}`;
  }

  function rel(ms, now) {
    let diff = ms - now;
    const over = diff < 0;
    diff = Math.abs(diff);
    if (diff < 60000) return over ? '刚刚逾期' : '马上';
    const day = Math.floor(diff / 86400000);
    const h = Math.floor(diff / 3600000);
    const m = Math.floor(diff / 60000);
    const s = day > 0 ? `${day} 天` : h > 0 ? `${h} 小时` : `${m} 分钟`;
    return over ? `逾期 ${s}` : `还有 ${s}`;
  }

  /* ---------------- iCalendar ---------------- */
  const icsEsc = s => String(s)
    .replace(/\\/g, '\\\\')
    .replace(/;/g, '\\;')
    .replace(/,/g, '\\,')
    .replace(/\r?\n/g, '\\n');

  function icsDate(ms) {
    const x = new Date(ms);
    return `${x.getUTCFullYear()}${pad(x.getUTCMonth() + 1)}${pad(x.getUTCDate())}T${pad(x.getUTCHours())}${pad(x.getUTCMinutes())}${pad(x.getUTCSeconds())}Z`;
  }

  function triggerStr(min) {
    if (min <= 0) return null;
    if (min % 1440 === 0) return `-P${min / 1440}D`;
    if (min % 60 === 0) return `-PT${min / 60}H`;
    return `-PT${min}M`;
  }

  function fold(line) {
    const enc = new TextEncoder();
    let out = '', bytes = 0;
    for (const ch of line) {
      const n = enc.encode(ch).length;
      if (bytes + n > 74) { out += '\r\n '; bytes = 1; }
      out += ch;
      bytes += n;
    }
    return out;
  }

  function buildICS(arr) {
    const lines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//TKtodo//CN',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH'
    ];
    const stamp = icsDate(Date.now());
    const trig = triggerStr(offMin);

    for (const it of arr) {
      lines.push('BEGIN:VEVENT');
      lines.push('UID:' + it.id + '@tktodo');
      lines.push('DTSTAMP:' + stamp);
      lines.push('DTSTART:' + icsDate(it.due));
      lines.push('DTEND:' + icsDate(it.due + 30 * 60000));
      lines.push('SUMMARY:' + icsEsc(it.title));
      lines.push('DESCRIPTION:' + icsEsc('截止：' + fmt(it.due)));
      if (trig) {
        lines.push('BEGIN:VALARM');
        lines.push('TRIGGER:' + trig);
        lines.push('ACTION:DISPLAY');
        lines.push('DESCRIPTION:' + icsEsc(it.title));
        lines.push('END:VALARM');
      }
      lines.push('END:VEVENT');
    }

    lines.push('END:VCALENDAR');
    return lines.map(fold).join('\r\n') + '\r\n';
  }

  const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  function deliver(ics, name) {
    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.rel = 'noopener';
    if (!isIOS()) a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);

    if (isIOS()) {
      toast('已生成日历文件。若没有自动弹出，请到「文件 → 下载」里点开它。');
    } else {
      toast('已下载 ' + name + '\n到「文件 → 下载」里点开，选择用日历导入。');
    }
  }

  const safeName = s => String(s).replace(/[\\/:*?"<>|\r\n]+/g, ' ').trim().slice(0, 40) || 'TKtodo';

  function exportOne(it) {
    deliver(buildICS([it]), safeName(it.title) + '.ics');
  }

  function exportAll() {
    const act = items.filter(x => !x.done);
    if (!act.length) return;
    const now = new Date();
    deliver(buildICS(act), `TKtodo-${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}.ics`);
  }

  /* ---------------- 渲染 ---------------- */
  function editorHTML(it) {
    return `<li class="row editing" data-id="${it.id}">
      <div class="editor">
        <input class="et" type="text" value="${esc(it.title)}" aria-label="任务">
        <input class="ed" type="datetime-local" value="${toInput(it.due)}" aria-label="截止时间">
        <div class="eacts">
          <button class="del ghost danger" type="button">删除</button>
          <span class="spacer"></span>
          <button class="cancel ghost" type="button">取消</button>
          <button class="save" type="button">保存</button>
        </div>
      </div>
    </li>`;
  }

  function rowHTML(it, now) {
    if (it.id === editing) return editorHTML(it);

    const over = !it.done && it.due < now;
    const soon = !it.done && !over && it.due - now <= 86400000;
    const calBtn = it.done ? '' : `<button class="cal" type="button" aria-label="加入日历">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8.3"/><path d="M12 7.6V12l3 1.9"/>
        </svg>
      </button>`;
    return `<li class="row${it.done ? ' done' : ''}${over ? ' over' : ''}${soon ? ' soon' : ''}" data-id="${it.id}">
      <button class="check${it.done ? ' on' : ''}" type="button" aria-label="${it.done ? '取消完成' : '完成'}"><i></i></button>
      <div class="txt">
        <div class="title">${esc(it.title)}</div>
        <div class="meta"><span class="due">${fmt(it.due)}</span>${it.done ? '' : `<span class="left">${rel(it.due, now)}</span>`}</div>
      </div>${calBtn}
    </li>`;
  }

  function render() {
    const now = Date.now();
    const act = items.filter(x => !x.done).sort((a, b) => a.due - b.due);
    const dn = items.filter(x => x.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
    const open = doneBox.open;

    list.innerHTML = act.length
      ? act.map(x => rowHTML(x, now)).join('')
      : '<li class="empty">还没有待办</li>';
    doneList.innerHTML = dn.map(x => rowHTML(x, now)).join('');

    doneBox.hidden = dn.length === 0;
    doneBox.open = open;
    summary.textContent = `已完成 ${dn.length}`;
    allBtn.disabled = act.length === 0;
    clearBtn.hidden = dn.length === 0;
  }

  /* ---------------- 提醒设置 ---------------- */
  function syncOffUI() {
    if (PRESETS.includes(offMin)) {
      selOff.value = String(offMin);
      customBox.hidden = true;
    } else {
      selOff.value = 'custom';
      customBox.hidden = false;
      const unit = offMin % 1440 === 0 ? 1440 : (offMin % 60 === 0 ? 60 : 1);
      cu.value = String(unit);
      cn.value = String(offMin / unit);
    }
  }

  selOff.addEventListener('change', () => {
    if (selOff.value === 'custom') {
      customBox.hidden = false;
      const n = parseInt(cn.value, 10) || 1;
      const u = parseInt(cu.value, 10) || 1;
      offMin = Math.max(1, n * u);
      saveOff();
    } else {
      offMin = parseInt(selOff.value, 10);
      saveOff();
      customBox.hidden = true;
    }
  });

  function readCustom() {
    const n = Math.max(1, Math.min(parseInt(cn.value, 10) || 1, 999));
    const u = parseInt(cu.value, 10) || 1;
    offMin = Math.min(n * u, 525600);
    saveOff();
  }
  cn.addEventListener('input', readCustom);
  cu.addEventListener('change', readCustom);

  allBtn.addEventListener('click', exportAll);

  /* ---------------- 新增 ---------------- */
  f.addEventListener('submit', e => {
    e.preventDefault();
    const title = t.value.trim();
    if (!title) { t.focus(); return; }
    if (!d.value) { d.focus(); return; }
    const due = new Date(d.value).getTime();
    if (!Number.isFinite(due)) { d.focus(); return; }

    items.push({ id: uid(), title, due, done: false, doneAt: 0, created: Date.now() });
    save();
    t.value = '';
    d.value = defaultDue();
    render();
    t.focus();
  });

  /* ---------------- 行内交互 ---------------- */
  function onRow(e) {
    const row = e.target.closest('.row');
    if (!row) return;
    const it = items.find(x => x.id === row.dataset.id);
    if (!it) return;

    if (e.target.closest('.save')) {
      const title = row.querySelector('.et').value.trim();
      if (title) it.title = title;
      const due = new Date(row.querySelector('.ed').value).getTime();
      if (Number.isFinite(due)) it.due = due;
      save();
      editing = null;
      render();
      return;
    }

    if (e.target.closest('.cancel')) {
      editing = null;
      render();
      return;
    }

    if (e.target.closest('.del')) {
      items = items.filter(x => x.id !== it.id);
      editing = null;
      save();
      render();
      return;
    }

    if (e.target.closest('.editor')) return;

    if (e.target.closest('.cal')) {
      exportOne(it);
      return;
    }

    if (e.target.closest('.check')) {
      it.done = !it.done;
      it.doneAt = it.done ? Date.now() : 0;
      save();
      render();
      return;
    }

    editing = (editing === it.id) ? null : it.id;
    render();
    const input = list.querySelector('.editor .et');
    if (input) {
      input.focus();
      try { input.setSelectionRange(input.value.length, input.value.length); } catch (err) {}
    }
  }

  list.addEventListener('click', onRow);
  doneList.addEventListener('click', onRow);

  list.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.classList.contains('et')) {
      e.preventDefault();
      const saveBtn = e.target.closest('.row').querySelector('.save');
      if (saveBtn) saveBtn.click();
    }
    if (e.key === 'Escape' && e.target.classList.contains('et')) {
      editing = null;
      render();
    }
  });

  clearBtn.addEventListener('click', () => {
    if (!items.some(x => x.done)) return;
    if (!confirm('清空全部已完成的任务？')) return;
    items = items.filter(x => !x.done);
    save();
    render();
  });

  /* ---------------- 检查更新 ---------------- */
  const updBtn = $('#upd');
  const updBar = $('#updBar');
  const updGo = $('#updGo');
  let autoBusy = false;
  let lastAuto = 0;

  const currentBuild = () => document.querySelector('meta[name="build"]').content;

  async function fetchRemoteBuild() {
    const res = await fetch(location.pathname + '?t=' + Date.now(), { cache: 'no-store' });
    const html = await res.text();
    const m = html.match(/<meta name="build" content="([^"]+)"/);
    return m ? m[1] : null;
  }

  // 打开时静默检查：有新版本就在按钮上亮红点
  async function autoCheck() {
    if (autoBusy) return;
    autoBusy = true;
    try {
      const b = await fetchRemoteBuild();
      if (b && b !== currentBuild()) {
        updBtn.classList.add('has-new');
        updBtn.textContent = '有新版本，点此更新';
        updBar.hidden = false;
      }
    } catch (err) {}
    autoBusy = false;
  }

  function maybeAutoCheck() {
    const now = Date.now();
    if (now - lastAuto < 5 * 60000) return;
    lastAuto = now;
    autoCheck();
  }

  async function checkUpdate() {
    updBtn.disabled = true;
    updBtn.textContent = '检查中…';
    try {
      const b = await fetchRemoteBuild();
      if (b && b !== currentBuild()) {
        updBtn.textContent = '发现新版本，正在更新…';
        location.replace(location.pathname + '?v=' + Date.now());
        return;
      }
      updBtn.classList.remove('has-new');
      updBar.hidden = true;
      updBtn.textContent = '已是最新版本';
      setTimeout(() => {
        updBtn.textContent = '检查更新';
        updBtn.disabled = false;
      }, 1800);
    } catch (err) {
      updBtn.textContent = '检查失败，点此重试';
      updBtn.disabled = false;
    }
  }

  updBtn.addEventListener('click', checkUpdate);

  updGo.addEventListener('click', () => {
    location.replace(location.pathname + '?v=' + Date.now());
  });

  // 安装成 app 后常常是“恢复”而不是重新加载，所以在回到前台时也查一次
  setTimeout(maybeAutoCheck, 1000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') setTimeout(maybeAutoCheck, 600);
  });

  d.value = defaultDue();
  syncOffUI();
  render();
  setInterval(() => { if (!editing) render(); }, 60000);
})();
</script>
</body>
</html>
