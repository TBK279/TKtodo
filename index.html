<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TKtodo">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme:dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>TKtodo</title>
<meta name="build" content="20261023-2056">
<style>
  :root{
    --bg:#f5f5f7;
    --card:#ffffff;
    --fg:#111114;
    --mute:#8a8a90;
    --line:#ebebef;
    --over:#d9363e;
    --btn:#111114;
    --btn-fg:#ffffff;
    --dim:#5c5c64;
    --pill:#f0f0f4;
    --pill-fg:#3c3c44;
    --soon-bg:#fcf0dd;
    --soon-fg:#955700;
    --over-bg:#fbe5e6;
    --over-fg:#c0292f;
    --blue-bg:#e7f0fe;
    --blue-fg:#0b62d6;
    --ok-bg:#e6f6ea;
    --ok-fg:#1a7f37;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000;
      --card:#151517;
      --fg:#f2f2f4;
      --mute:#8a8a90;
      --line:#2b2b30;
      --over:#ff5f5f;
      --btn:#f2f2f4;
      --btn-fg:#0b0b0d;
      --dim:#b4b4bc;
      --pill:#26262b;
      --pill-fg:#e8e8ec;
      --soon-bg:#302619;
      --soon-fg:#f2b862;
      --over-bg:#331a1c;
      --over-fg:#ff8585;
      --blue-bg:#13263f;
      --blue-fg:#6cb0ff;
      --ok-bg:#12291a;
      --ok-fg:#5ed27a;
    }
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    padding:calc(env(safe-area-inset-top, 0px) + 32px) 16px calc(env(safe-area-inset-bottom, 0px) + 32px);
    background:var(--bg); color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  main{
    margin:auto;
    width:100%;
    max-width:500px;
  }
  h1{
    margin:0 0 22px;
    text-align:center;
    font-size:21px;
    font-weight:700;
    letter-spacing:.5px;
  }

  /* ---------- 输入卡片 ---------- */
  form{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:0 18px 16px;
  }
  #t{
    display:block; width:100%;
    font:inherit; font-size:18px; font-weight:600; color:inherit;
    text-align:center;
    background:none; border:0; outline:none;
    padding:18px 0 16px;
    min-height:56px;
    -webkit-appearance:none; appearance:none;
  }
  #t::placeholder{ color:var(--mute); font-weight:400; }
  #t:focus::placeholder{ opacity:.45; }

  .line{ height:1px; background:var(--line); }

  .row2{
    display:flex; flex-wrap:wrap; gap:10px;
    align-items:center; justify-content:center;
    padding-top:16px;
  }
  #d{
    font:inherit; font-size:16px; color:inherit;
    text-align:center;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:12px;
    padding:0 14px; min-height:44px;
    outline:none;
  }
  #d:focus{ border-color:var(--fg); }

  .wd{
    text-align:center; font-size:13px; color:var(--mute);
    margin-top:9px; min-height:18px;
  }
  .ewd{ font-size:13px; color:var(--mute); margin-top:-2px; }

  button{
    font:inherit; font-size:15px; font-weight:500;
    min-height:44px; padding:0 18px;
    border:0; border-radius:12px; cursor:pointer;
    background:var(--btn); color:var(--btn-fg);
  }
  button:active{ opacity:.62; }
  button:disabled{ opacity:.35; cursor:default; }
  .ghost{ background:none; color:var(--mute); border:1px solid var(--line); }
  .danger{ color:var(--over); }

  /* ---------- 列表卡片 ---------- */
  ul{ list-style:none; margin:0; padding:0; }

  #list{
    margin-top:14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:2px 18px;
  }
  .row{
    display:flex; align-items:center; flex-wrap:wrap; gap:10px;
    padding:13px 0; border-top:1px solid var(--line); cursor:pointer;
  }
  #list .row:first-child{ border-top:0; }

  .check{
    flex:0 0 40px; width:40px; height:40px; min-height:40px;
    margin:-7px -8px -7px -10px; padding:0;
    background:none; border:0; border-radius:0;
    display:flex; align-items:center; justify-content:center;
  }
  .check i{
    width:21px; height:21px; border-radius:50%;
    border:1.5px solid var(--mute);
    display:flex; align-items:center; justify-content:center;
    transition:background .15s, border-color .15s;
  }
  .check.on i{ background:var(--fg); border-color:var(--fg); }
  .check.on i::after{
    content:""; width:4px; height:8px;
    border:solid var(--card); border-width:0 2px 2px 0;
    transform:rotate(45deg) translate(-1px,-1px);
  }

  .txt{ flex:1; min-width:0; }
  .title{ font-size:16px; word-break:break-word; }
  .meta{ display:flex; align-items:center; flex-wrap:wrap; gap:6px 8px; margin-top:5px; font-size:14px; color:var(--mute); }
  .due{ font-variant-numeric:tabular-nums; font-weight:500; color:var(--dim); }
  .left, .est{
    display:inline-flex; align-items:center;
    padding:1px 8px 2px; border-radius:999px;
    font-size:12.5px; font-weight:600; line-height:1.5;
    background:var(--pill); color:var(--pill-fg);
  }
  .left.blue, .est.blue{ background:var(--blue-bg); color:var(--blue-fg); }
  .left.early, .est.early{ background:var(--ok-bg); color:var(--ok-fg); }
  .left.warn, .est.warn{ background:var(--soon-bg); color:var(--soon-fg); }
  .left.over, .est.over{ background:var(--over-bg); color:var(--over-fg); }
  .over .due{ color:var(--over); }
  .done .title{ color:var(--mute); text-decoration:line-through; }

  .cal{
    flex:0 0 40px; width:40px; height:40px; min-height:40px;
    margin:-7px -10px -7px 0; padding:0;
    background:none; border:0; border-radius:0;
    color:var(--mute);
    display:flex; align-items:center; justify-content:center;
  }
  .cal:active{ opacity:.5; }

  /* ---------- 就地编辑 ---------- */
  .row.editing{ cursor:default; }
  .editor{
    width:100%;
    display:flex; flex-direction:column; gap:8px;
    animation:slideIn .18s ease-out;
  }
  @keyframes slideIn{
    from{ opacity:0; transform:translateY(-6px); }
    to{ opacity:1; transform:none; }
  }
  .editor input{
    font:inherit; font-size:16px; color:inherit; width:100%;
    background:var(--bg);
    border:1px solid var(--line); border-radius:11px;
    padding:0 12px; min-height:44px; outline:none;
  }
  .editor input:focus{ border-color:var(--fg); }
  .eacts{ display:flex; align-items:center; gap:8px; }
  .etext{ font-size:16px; padding:8px 2px; word-break:break-word; }
  .eacts .spacer{ flex:1; }
  .eacts button{ min-height:38px; font-size:14px; padding:0 14px; border-radius:10px; }

  .empty{
    text-align:center; color:var(--mute);
    padding:34px 0; font-size:14px;
  }

  /* ---------- 日历工具条 ---------- */
  .tools{
    margin-top:12px;
    display:flex; align-items:center; justify-content:center;
    flex-wrap:wrap; gap:8px;
    font-size:14px; color:var(--mute);
  }
  .tools select, .tools input{
    font:inherit; font-size:16px; color:var(--fg);
    background:var(--bg);
    border:1px solid var(--line); border-radius:10px;
    padding:0 8px; min-height:36px; outline:none;
  }
  .tools select:focus, .tools input:focus{ border-color:var(--fg); }
  #cn{ width:58px; text-align:center; }
  #all{ font-size:14px; min-height:36px; padding:0 14px; border-radius:10px; }

  /* ---------- 已完成 ---------- */
  details{
    margin-top:14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:0 18px 2px;
  }
  summary{
    list-style:none; cursor:pointer; user-select:none;
    text-align:center; font-size:13px; color:var(--mute);
    padding:15px 0;
  }
  summary::-webkit-details-marker{ display:none; }
  .done-bar{
    display:flex; align-items:center; justify-content:center;
    flex-wrap:wrap; gap:8px; margin:0 0 10px;
  }
  .done-bar button{
    min-height:32px; font-size:12.5px; padding:0 12px; border-radius:9px;
  }
  #doneMore{
    display:block; margin:8px auto 14px;
    font-size:13px; min-height:34px; padding:0 14px; border-radius:9px;
  }
  #doneMore[hidden]{ display:none; }

  /* ---------- 多选 ---------- */
  .pick{
    flex:0 0 40px; width:40px; height:40px; min-height:40px;
    margin:-7px -8px -7px -10px; padding:0;
    background:none; border:0;
    display:flex; align-items:center; justify-content:center;
  }
  .pick i{
    width:20px; height:20px; border-radius:6px;
    border:1.5px solid var(--mute);
    display:flex; align-items:center; justify-content:center;
    transition:background .15s, border-color .15s;
  }
  .pick.on i{ background:var(--fg); border-color:var(--fg); }
  .pick.on i::after{
    content:""; width:4px; height:8px;
    border:solid var(--card); border-width:0 2px 2px 0;
    transform:rotate(45deg) translate(-1px,-1px);
  }
  .row.sel{ background:var(--bg); border-radius:10px; }

  #selBar{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom, 0px) + 10px);
    width:min(92vw, 460px);
    display:flex; flex-direction:column; gap:8px;
    background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:9px 12px;
    box-shadow:0 8px 28px rgba(0,0,0,.18);
    z-index:17;
  }
  #selBar[hidden]{ display:none; }
  #selCount{ font-size:12.5px; color:var(--mute); text-align:center; }
  .sel-acts{ display:flex; flex-wrap:wrap; gap:6px; }
  .sel-acts button{
    flex:1 1 auto; min-height:36px; font-size:13px; padding:0 10px; border-radius:10px;
  }
  .sel-acts button[hidden]{ display:none; }
  body.sel{ padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 136px); }
  body.sel #toast{ bottom:calc(env(safe-area-inset-bottom, 0px) + 158px); }

  .est-row{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:6px; margin-top:12px;
  }
  .est-label{ font-size:13px; color:var(--mute); margin-right:2px; }
  .chip{
    background:none; border:1px solid var(--line); color:var(--mute);
    border-radius:999px; padding:0 11px; min-height:30px;
    font-size:13px; font-weight:500;
  }
  .chip.on{ background:var(--fg); border-color:var(--fg); color:var(--bg); }
  /* ---------- 日期选择器 ---------- */
  #d, .ed{ cursor:pointer; }
  #d::placeholder{ color:var(--mute); }

  html.lock, body.lock{ overflow:hidden; }

  #pickerBack{
    position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:20;
    touch-action:none;
  }
  #picker{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:21;
    width:min(92vw, 380px);
    max-height:88vh; overflow-y:auto;
    overscroll-behavior: contain;
    background:var(--card);
    border-radius:20px;
    padding:16px 16px 14px;
    box-shadow:0 20px 60px rgba(0,0,0,.32);
  }
  .pk-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .pk-head button{
    background:none; border:0; color:var(--fg);
    font-size:24px; line-height:1; padding:0 14px; min-height:36px;
  }
  #pkLabel{ font-size:15px; font-weight:600; }
  .pk-week{
    display:grid; grid-template-columns:repeat(7,1fr);
    text-align:center; font-size:12px; color:var(--mute); margin-bottom:4px;
  }
  .pk-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .day{
    background:none; border:0; border-radius:10px;
    padding:4px 0 3px; min-height:50px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:15px; color:var(--fg);
  }
  .day em{ font-style:normal; font-size:10px; line-height:1.3; color:var(--mute); }
  .day.sel{ background:var(--fg); color:var(--bg); }
  .day.sel em{ color:var(--bg); opacity:.7; }
  .day.today{ box-shadow:inset 0 0 0 1.5px var(--mute); }
  .wheels{
    position:relative;
    display:flex; align-items:center; justify-content:center; gap:2px;
    margin:6px 0 2px;
  }
  .wheels::before{
    content:""; position:absolute; left:50%; top:50%;
    width:152px; height:40px; transform:translate(-50%,-50%);
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    pointer-events:none;
  }
  .wheel{
    width:64px; height:200px; overflow-y:auto;
    scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior: contain;
    scrollbar-width:none; text-align:center;
  }
  .wheel::-webkit-scrollbar{ display:none; }
  .wheel::before, .wheel::after{ content:""; display:block; height:80px; }
  .wheel .item{
    height:40px; line-height:40px; scroll-snap-align:center;
    font-size:20px; color:var(--mute);
    font-variant-numeric:tabular-nums;
  }
  .wheel .item.on{ color:var(--fg); font-weight:600; }
  .colon{ font-size:20px; color:var(--fg); padding:0 2px; }
  .pk-acts{ display:flex; align-items:center; gap:8px; margin-top:12px; }
  .pk-acts .spacer{ flex:1; }

  .est-custom{
    display:flex; flex-direction:column; align-items:center;
    width:100%; margin-top:6px;
  }
  .est-custom[hidden]{ display:none; }
  .ewrap{ display:flex; align-items:center; justify-content:center; gap:6px; }
  .ewheel{
    width:56px; height:136px; overflow-y:auto;
    scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    scrollbar-width:none; text-align:center;
    background:var(--bg); border:1px solid var(--line); border-radius:10px;
  }
  .ewheel::-webkit-scrollbar{ display:none; }
  .ewheel::before, .ewheel::after{ content:""; display:block; height:51px; }
  .witem{
    height:34px; line-height:34px; scroll-snap-align:center;
    font-size:16px; color:var(--mute);
    font-variant-numeric:tabular-nums;
  }
  .witem.on{ color:var(--fg); font-weight:600; }
  .eunit{ font-size:12px; color:var(--mute); }
  .est-ok{
    margin-top:8px; min-height:34px; padding:0 20px;
    font-size:13px; font-weight:500;
    background:var(--fg); color:var(--bg);
    border:0; border-radius:10px;
  }

  /* ---------- 导入日历弹窗 ---------- */
  #calBack{
    position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:22;
    touch-action:none;
  }
  #calBack[hidden]{ display:none; }
  #calModal{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:23;
    width:min(92vw, 400px); max-height:86vh;
    display:flex; flex-direction:column;
    background:var(--card); border-radius:20px;
    padding:16px; box-shadow:0 20px 60px rgba(0,0,0,.32);
    overscroll-behavior:contain;
  }
  #calModal[hidden]{ display:none; }
  .cm-head{ font-size:16px; font-weight:600; text-align:center; margin-bottom:10px; }
  .cm-list{
    list-style:none; margin:0; padding:0;
    overflow-y:auto; flex:1; min-height:70px;
    overscroll-behavior:contain;
  }
  .cm-item{ border-top:1px solid var(--line); }
  .cm-item:first-child{ border-top:0; }
  .cm-item label{ display:flex; align-items:center; gap:10px; padding:10px 0; cursor:pointer; }
  .cm-item input{ width:18px; height:18px; accent-color:var(--fg); flex:0 0 auto; }
  .cm-title{
    flex:1; min-width:0; font-size:15px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .cm-due{ font-size:12px; color:var(--mute); flex:0 0 auto; }
  .cm-acts{ display:flex; gap:8px; margin-top:8px; }
  .cm-acts button{ flex:1; min-height:36px; font-size:14px; padding:0 10px; border-radius:10px; }
  .cm-remind{
    display:flex; align-items:center; justify-content:center; flex-wrap:wrap;
    gap:8px; margin-top:12px; font-size:14px; color:var(--mute);
  }
  .cm-remind select, .cm-remind input{
    font:inherit; font-size:16px; color:var(--fg);
    background:var(--bg); border:1px solid var(--line);
    border-radius:10px; padding:0 8px; min-height:36px; outline:none;
  }
  .cm-remind input{ width:60px; text-align:center; }
  .cm-foot{ display:flex; gap:8px; margin-top:14px; }
  .cm-foot button{ flex:1; }

  /* ---------- 最近删除 / 确认弹窗 ---------- */
  .trashbar{
    margin-top:6px; text-align:center;
    display:flex; align-items:center; justify-content:center;
  }
  .trashbar .sep{ color:var(--mute); opacity:.45; font-size:12px; }

  .rowacts{
    flex:0 0 100%;
    display:flex; gap:8px;
    padding:4px 0 2px 46px;
    animation:slideIn .16s ease-out;
  }
  .rowacts button{ min-height:32px; font-size:13px; padding:0 12px; border-radius:9px; }

  #trashBack, #cfBack, #bkBack{
    position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:24;
    touch-action:none;
  }
  #trashBack[hidden], #cfBack[hidden], #bkBack[hidden]{ display:none; }

  #trashModal, #cfModal, #bkModal{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:25;
    width:min(92vw, 400px); max-height:86vh;
    display:flex; flex-direction:column;
    background:var(--card); border-radius:20px;
    padding:16px; box-shadow:0 20px 60px rgba(0,0,0,.32);
    overscroll-behavior:contain;
  }
  #trashModal[hidden], #cfModal[hidden], #bkModal[hidden]{ display:none; }

  .trash-max{
    display:flex; align-items:center; justify-content:center; gap:6px;
    font-size:13px; color:var(--mute); margin-bottom:8px;
  }
  .trash-max input{
    width:60px; text-align:center;
    font:inherit; font-size:16px; color:var(--fg);
    background:var(--bg); border:1px solid var(--line);
    border-radius:9px; padding:0 6px; min-height:32px; outline:none;
  }
  .trash-row{ display:flex; align-items:center; gap:8px; padding:10px 0; }
  .trash-txt{ flex:1; min-width:0; }
  .trash-txt .cm-title{ font-size:15px; }
  .trash-txt .cm-due{ display:block; font-size:12px; color:var(--mute); margin-top:2px; }
  .trash-row button{ min-height:30px; font-size:12.5px; padding:0 10px; border-radius:9px; flex:0 0 auto; }

  .cf-title{ font-size:16px; font-weight:600; text-align:center; margin-bottom:8px; }
  .cf-body{ font-size:14px; color:var(--mute); text-align:center; line-height:1.6; white-space:pre-line; }
  .cf-acts{ display:flex; gap:8px; margin-top:16px; }
  .cf-acts button{ flex:1; }
  #cfOk{ background:var(--over); color:#fff; }

  /* ---------- 备份 / 迁移 ---------- */
  #bkModal{ overflow-y:auto; }
  #bkModal .bk-note{
    font-size:12.5px; color:var(--mute); line-height:1.6; text-align:center;
  }
  .bk-stats{ font-size:13px; color:var(--fg); text-align:center; }
  #bkStats{ margin-bottom:10px; }
  .bk-acts{ display:flex; gap:8px; margin-top:12px; }
  .bk-acts button{ flex:1; min-height:40px; font-size:14px; padding:0 10px; border-radius:10px; }
  #bkPreview{ border-top:1px solid var(--line); margin-top:14px; padding-top:12px; }
  #bkPreview[hidden]{ display:none; }
  #bkStats2{ margin-bottom:2px; }
  .bk-sub{ font-size:12.5px; color:var(--mute); text-align:center; min-height:17px; }
  .bk-paste{
    margin-top:14px; padding:10px 0 0; border-top:1px solid var(--line);
    background:none; border-radius:0; border-left:0; border-right:0; border-bottom:0;
  }
  .bk-paste summary{ padding:4px 0; font-size:12.5px; text-align:center; }
  .bk-paste[open] summary{ color:var(--mute); }
  #bkPreview .bk-note{ margin-top:8px; }
  #bkText{
    display:block; width:100%; min-height:76px; margin-top:8px;
    font:inherit; font-size:13px; color:var(--fg);
    background:var(--bg); border:1px solid var(--line);
    border-radius:10px; padding:8px 10px; outline:none; resize:vertical;

  }

  /* ---------- 更新提示条 ---------- */
  #updBar{

  }
  #updBar[hidden]{ display:none; }
  #updBar::before{

  #updX{

  /* ---------- 提示 ---------- */
  #toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom, 0px) + 84px);

  }
  @media (prefers-color-scheme: dark){
    #toast{ background:#f2f2f4; color:#101012; }

  /* ---------- 检查更新 ---------- */
  .foot{ margin-top:20px; text-align:center; }
  .link{

  .link:active{ opacity:.55; }

  .buildtag{ display:block; font-size:11px; color:var(--mute); opacity:.7; margin-top:2px; }
  .link.has-new{

    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 50%{ opacity:.3; } }
</style>

<script>
(() => {
  const KEY = 'ddl.v1';
  const OFF_KEY = 'ddl.off.v1';
  const $ = s => document.querySelector(s);
  const f = $('#f'), t = $('#t'), d = $('#d'), b = $('#b');
  const list = $('#list'), doneBox = $('#doneBox'), doneList = $('#doneList'), summary = $('#summary');
  const clearBtn = $('#clearDone');
  const wd = $('#wd'), nowBtn = $('#now');
  const calOpen = $('#calOpen'), calBack = $('#calBack'), calModal = $('#calModal');
  const cmList = $('#cmList'), cmAll = $('#cmAll'), cmNone = $('#cmNone');
  const cmOff = $('#cmOff'), cmCustom = $('#cmCustom'), cmN = $('#cmN'), cmU = $('#cmU');
  const cmCancel = $('#cmCancel'), cmGo = $('#cmGo');
  const trashOpen = $('#trashOpen'), trashBack = $('#trashBack'), trashModal = $('#trashModal');
  const trashList = $('#trashList'), trashMaxEl = $('#trashMax'), trashClear = $('#trashClear'), trashClose = $('#trashClose');
  const cfBack = $('#cfBack'), cfModal = $('#cfModal'), cfTitle = $('#cfTitle'), cfBody = $('#cfBody');
  const cfCancel = $('#cfCancel'), cfOk = $('#cfOk');
  const bkOpen = $('#bkOpen'), bkBack = $('#bkBack'), bkModal = $('#bkModal');
  const bkStats = $('#bkStats'), bkStats2 = $('#bkStats2'), bkSub = $('#bkSub');
  const bkExport = $('#bkExport'), bkPick = $('#bkPick'), bkFile = $('#bkFile');
  const bkPreview = $('#bkPreview'), bkMerge = $('#bkMerge'), bkReplace = $('#bkReplace');
  const bkText = $('#bkText'), bkPasteGo = $('#bkPasteGo'), bkClose = $('#bkClose');
  const doneSelect = $('#doneSelect'), doneMore = $('#doneMore');
  const selOpen = $('#selOpen'), selBar = $('#selBar'), selCount = $('#selCount');
  const selAll = $('#selAll'), selDone = $('#selDone'), selUndone = $('#selUndone');
  const selDel = $('#selDel'), selExit = $('#selExit');
  const toastEl = $('#toast');

  const TRASH_KEY = 'ddl.trash.v1';
  const TRASHMAX_KEY = 'ddl.trashmax.v1';

  let items = [];
  try {
    const parsed = JSON.parse(localStorage.getItem(KEY) || '[]');
    if (Array.isArray(parsed)) items = parsed;
  } catch (e) {}

  let trash = [];
  try {
    const parsed = JSON.parse(localStorage.getItem(TRASH_KEY) || '[]');
    if (Array.isArray(parsed)) trash = parsed;
  } catch (e) {}

  let trashMax = 5;
  try {
    const v = parseInt(localStorage.getItem(TRASHMAX_KEY), 10);
    if (v > 0) trashMax = Math.min(30, v);
  } catch (e) {}

  const saveTrash = () => localStorage.setItem(TRASH_KEY, JSON.stringify(trash));

  let offMin = 1440;
  try {
    const v = parseInt(localStorage.getItem(OFF_KEY), 10);
    if (Number.isFinite(v) && v >= 0) offMin = v;
  } catch (e) {}

  let editing = null;
  let renaming = false;
  let estMin = 0;
  let toastTimer = 0;

  const DONE_PREVIEW = 5;      // 已完成的默认只看最近几条
  let doneExpanded = false;
  let selMode = false;         // 多选模式
  const selIds = new Set();

  const PRESETS = [0, 15, 30, 60, 180, 1440, 2880, 4320];

  const save = () => localStorage.setItem(KEY, JSON.stringify(items));
  const saveOff = () => localStorage.setItem(OFF_KEY, String(offMin));
  const pad = n => String(n).padStart(2, '0');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const uid = () => (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.hidden = true; }, 4200);
  }

  function toInput(ms) {
    const x = new Date(ms);
    return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}T${pad(x.getHours())}:${pad(x.getMinutes())}`;
  }

  function defaultDueMs() {
    const x = new Date();
    x.setHours(18, 0, 0, 0);
    if (x.getTime() <= Date.now()) x.setDate(x.getDate() + 1);
    return x.getTime();
  }

  function fmt(ms) {
    const x = new Date(ms);
    const md = `${pad(x.getMonth() + 1)}-${pad(x.getDate())} ${pad(x.getHours())}:${pad(x.getMinutes())}`;
    return x.getFullYear() === new Date().getFullYear() ? md : `${x.getFullYear()}-${md}`;
  }

  function rel(ms, now) {
    let diff = ms - now;
    const over = diff < 0;
    diff = Math.abs(diff);
    if (diff < 60000) return over ? '刚刚逾期' : '马上';
    const day = Math.floor(diff / 86400000);
    const h = Math.floor(diff / 3600000);
    const m = Math.floor(diff / 60000);
    const s = day > 0 ? `${day} 天` : h > 0 ? `${h} 小时` : `${m} 分钟`;
    return over ? `逾期 ${s}` : `还有 ${s}`;
  }

  function wdText(ms) {
    const x = new Date(ms);
    const w = '日一二三四五六'[x.getDay()];
    const diff = ms - Date.now();
    const abs = Math.abs(diff);
    let s;
    if (abs < 60000) {
      s = '就是现在';
    } else {
      const day = Math.floor(abs / 86400000);
      const h = Math.floor(abs / 3600000);
      const m = Math.floor(abs / 60000);
      const unit = day > 0 ? `${day} 天` : h > 0 ? `${h} 小时` : `${m} 分钟`;
      s = diff < 0 ? `已过 ${unit}` : `还有 ${unit}`;
    }
    return `周${w} · ${s}`;
  }

  function dur(min) {
    if (min >= 1440 && min % 1440 === 0) return `${min / 1440} 天`;
    if (min >= 60) return min % 60 === 0 ? `${min / 60} 小时` : `${Math.floor(min / 60)} 小时 ${min % 60} 分`;
    return `${min} 分钟`;
  }

  const EST_PRESETS = [[0, '无'], [30, '半小时'], [60, '1 小时'], [120, '2 小时']];
  const EST_ITEM_H = 34;

  function estBlockHTML(val) {
    const v = val || 0;
    const isCustom = v !== 0 && !EST_PRESETS.some(p => p[0] === v);
    const customLabel = isCustom ? dur(v) : '自定义';
    const chips = EST_PRESETS.map(p =>
      `<button class="chip${p[0] === v ? ' on' : ''}" type="button" data-est="${p[0]}">${p[1]}</button>`
    ).join('') + `<button class="chip${isCustom ? ' on' : ''}" type="button" data-est="custom">${customLabel}</button>`;

    return chips +
      `<span class="est-custom" data-v="${v}" hidden>` +
      `<span class="ewrap">` +
      `<span class="ewheel est-h"></span><span class="eunit">小时</span>` +
      `<span class="ewheel est-m"></span><span class="eunit">分</span>` +
      `</span>` +
      `<button class="est-ok" type="button">确定</button>` +
      `</span>`;
  }

  function buildSmallWheel(el, count) {
    el.textContent = '';
    for (let i = 0; i < count; i++) {
      const d = document.createElement('div');
      d.className = 'witem';
      d.textContent = String(i).padStart(2, '0');
      el.appendChild(d);
    }
  }

  function smallWheelIdx(el) {
    const i = Math.round(el.scrollTop / EST_ITEM_H);
    return Math.max(0, Math.min(i, el.children.length - 1));
  }

  function markSmallWheel(el) {
    const idx = smallWheelIdx(el);
    for (let i = 0; i < el.children.length; i++) {
      el.children[i].classList.toggle('on', i === idx);
    }
  }

  function setSmallWheel(el, idx) {
    el.scrollTop = idx * EST_ITEM_H;
    markSmallWheel(el);
  }

  function estWheelChanged(box) {
    const group = box.closest('.est-row');
    if (!group) return;
    const h = smallWheelIdx(box.querySelector('.est-h'));
    const m = smallWheelIdx(box.querySelector('.est-m'));
    const chip = group.querySelector('.chip[data-est="custom"]');
    if (chip) {
      for (const c of group.querySelectorAll('.chip')) c.classList.toggle('on', c === chip);
    }
    setEstValue(group, h * 60 + m);
  }

  function initEstWheels(root) {
    for (const box of root.querySelectorAll('.est-custom')) {
      const hEl = box.querySelector('.est-h');
      const mEl = box.querySelector('.est-m');
      if (!hEl || !mEl || hEl.children.length) continue;

      buildSmallWheel(hEl, 24);
      buildSmallWheel(mEl, 60);

      const v = parseInt(box.dataset.v, 10) || 0;
      setSmallWheel(hEl, Math.floor(v / 60) % 24);
      setSmallWheel(mEl, v % 60);

      hEl.addEventListener('scroll', () => { markSmallWheel(hEl); estWheelChanged(box); }, { passive: true });
      mEl.addEventListener('scroll', () => { markSmallWheel(mEl); estWheelChanged(box); }, { passive: true });
    }
  }

  /* ---------------- 日期选择器 ---------------- */
  const picker = $('#picker'), pkBack = $('#pickerBack'), pkGrid = $('#pkGrid');
  const pkLabel = $('#pkLabel'), whH = $('#whH'), whM = $('#whM');
  const WD = '日一二三四五六';
  let pkTarget = null;
  let pkView = new Date();
  let pkSel = { y: 0, m: 0, d: 0 };

  const ITEM_H = 40;

  function fillWheel(el, count) {
    el.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const d = document.createElement('div');
      d.className = 'item';
      d.textContent = String(i).padStart(2, '0');
      el.appendChild(d);
    }
  }
  fillWheel(whH, 24);
  fillWheel(whM, 60);

  function wheelIndex(el) {
    const i = Math.round(el.scrollTop / ITEM_H);
    return Math.max(0, Math.min(i, el.children.length - 1));
  }

  function markWheel(el) {
    const idx = wheelIndex(el);
    for (let i = 0; i < el.children.length; i++) {
      el.children[i].classList.toggle('on', i === idx);
    }
  }

  function setWheel(el, idx) {
    el.scrollTop = idx * ITEM_H;
    markWheel(el);
  }

  whH.addEventListener('scroll', () => markWheel(whH), { passive: true });
  whM.addEventListener('scroll', () => markWheel(whM), { passive: true });

  function applyDue(input, ms) {
    input.dataset.v = toInput(ms);
    input.value = toInput(ms).replace('T', ' ');
    if (input.id === 'd') {
      updateWd();
    } else {
      const row = input.closest('.row');
      const box = row && row.querySelector('.ewd');
      if (box) box.textContent = wdText(ms);
    }
  }

  let lockDepth = 0;

  function lockScroll(on) {
    lockDepth = Math.max(0, lockDepth + (on ? 1 : -1));
    const locked = lockDepth > 0;
    document.documentElement.classList.toggle('lock', locked);
    document.body.classList.toggle('lock', locked);
  }

  /* ---------------- 确认弹窗 ---------------- */
  let cfResolve = null;

  function askConfirm(title, body, okText) {
    cfTitle.textContent = title;
    cfBody.textContent = body;
    cfOk.textContent = okText || '删除';
    lockScroll(true);
    cfBack.hidden = false;
    cfModal.hidden = false;
    return new Promise(res => { cfResolve = res; });
  }

  function closeConfirm(v) {
    cfModal.hidden = true;
    cfBack.hidden = true;
    lockScroll(false);
    const r = cfResolve;
    cfResolve = null;
    if (r) r(v);
  }

  cfOk.addEventListener('click', () => closeConfirm(true));
  cfCancel.addEventListener('click', () => closeConfirm(false));
  cfBack.addEventListener('click', () => closeConfirm(false));

  function openPicker(input) {
    pkTarget = input;
    let base = new Date(input.dataset.v || toInput(Date.now()));
    if (isNaN(base.getTime())) base = new Date();
    pkSel = { y: base.getFullYear(), m: base.getMonth(), d: base.getDate() };
    pkView = new Date(pkSel.y, pkSel.m, 1);
    renderPicker();
    lockScroll(true);
    pkBack.hidden = false;
    picker.hidden = false;
    requestAnimationFrame(() => {
      setWheel(whH, base.getHours());
      setWheel(whM, base.getMinutes());
    });
  }

  function closePicker() {
    picker.hidden = true;
    pkBack.hidden = true;
    pkTarget = null;
    lockScroll(false);
  }

  function renderPicker() {
    const y = pkView.getFullYear(), m = pkView.getMonth();
    pkLabel.textContent = `${y} 年 ${m + 1} 月`;
    const first = new Date(y, m, 1).getDay();
    const days = new Date(y, m + 1, 0).getDate();
    const today = new Date();
    let html = '';
    for (let i = 0; i < first; i++) html += '<span></span>';
    for (let dd = 1; dd <= days; dd++) {

      const w = WD[new Date(y, m, dd).getDay()];
      html += `<button type="button" class="day${sel ? ' sel' : ''}${isToday ? ' today' : ''}" data-d="${dd}"><span>${dd}</span><em>${w}</em></button>`;
    }

  pkGrid.addEventListener('click', e => {

  /* ---------------- iCalendar ---------------- */
  const icsEsc = s => String(s)
    .replace(/\\/g, '\\\\')
    .replace(/;/g, '\\;')
    .replace(/,/g, '\\,')
    .replace(/\r?\n/g, '\\n');

  function icsDate(ms) {
    const x = new Date(ms);
    return `${x.getUTCFullYear()}${pad(x.getUTCMonth() + 1)}${pad(x.getUTCDate())}T${pad(x.getUTCHours())}${pad(x.getUTCMinutes())}${pad(x.getUTCSeconds())}Z`;
  }

  function triggerStr(min) {
    if (min <= 0) return null;
    if (min % 1440 === 0) return `-P${min / 1440}D`;
    if (min % 60 === 0) return `-PT${min / 60}H`;
    return `-PT${min}M`;
  }

  function fold(line) {
    const enc = new TextEncoder();
    let out = '', bytes = 0;
    for (const ch of line) {
      const n = enc.encode(ch).length;
      if (bytes + n > 74) { out += '\r\n '; bytes = 1; }
      out += ch;
      bytes += n;
    }
    return out;
  }

  function buildICS(arr) {
    const lines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//TKtodo//CN',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH'
    ];
    const stamp = icsDate(Date.now());
    const trig = triggerStr(offMin);

    for (const it of arr) {
      lines.push('BEGIN:VEVENT');
      lines.push('UID:' + it.id + '@tktodo');
      lines.push('DTSTAMP:' + stamp);
      lines.push('DTSTART:' + icsDate(it.due));
      lines.push('DTEND:' + icsDate(it.due + 30 * 60000));
      lines.push('SUMMARY:' + icsEsc(it.title));
      lines.push('DESCRIPTION:' + icsEsc('截止：' + fmt(it.due)));
      if (trig) {
        lines.push('BEGIN:VALARM');
        lines.push('TRIGGER:' + trig);
        lines.push('ACTION:DISPLAY');
        lines.push('DESCRIPTION:' + icsEsc(it.title));
        lines.push('END:VALARM');
      }
      lines.push('END:VEVENT');
    }

    lines.push('END:VCALENDAR');
    return lines.map(fold).join('\r\n') + '\r\n';
  }

  const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  function deliver(ics, name) {
    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.rel = 'noopener';
    if (!isIOS()) a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);

    if (isIOS()) {
      toast('已生成日历文件。若没有自动弹出，请到「文件 → 下载」里点开它。');
    } else {
      toast('已下载 ' + name + '\n到「文件 → 下载」里点开，选择用日历导入。');
    }
  }

  const safeName = s => String(s).replace(/[\\/:*?"<>|\r\n]+/g, ' ').trim().slice(0, 40) || 'TKtodo';

  /* ---------------- 导入日历弹窗 ---------------- */
  function syncCmOff() {
    if (PRESETS.includes(offMin)) {
      cmOff.value = String(offMin);
      cmCustom.hidden = true;
    } else {
      cmOff.value = 'custom';
      cmCustom.hidden = false;
      const unit = offMin % 1440 === 0 ? 1440 : (offMin % 60 === 0 ? 60 : 1);
      cmU.value = String(unit);
      cmN.value = String(offMin / unit);
    }
  }

  function openCal() {
    const act = items.filter(x => !x.done).sort((a, b) => a.due - b.due);
    if (!act.length) { toast('还没有可导入的待办'); return; }

    cmList.innerHTML = act.map(it => `
      <li class="cm-item">
        <label>
          <input type="checkbox" checked data-id="${it.id}">
          <span class="cm-title">${esc(it.title)}</span>
          <span class="cm-due">${fmt(it.due)}</span>
        </label>
      </li>`).join('');

    syncCmOff();
    lockScroll(true);
    calBack.hidden = false;
    calModal.hidden = false;
  }

  function closeCal() {
    calModal.hidden = true;
    calBack.hidden = true;
    lockScroll(false);
  }

  calOpen.addEventListener('click', openCal);
  cmCancel.addEventListener('click', closeCal);
  calBack.addEventListener('click', closeCal);

  cmAll.addEventListener('click', () => {
    for (const cb of cmList.querySelectorAll('input[type=checkbox]')) cb.checked = true;
  });
  cmNone.addEventListener('click', () => {

  cmOff.addEventListener('change', () => {

      cmCustom.hidden = false;
      const n = parseInt(cmN.value, 10) || 1;
      const u = parseInt(cmU.value, 10) || 1;

      saveOff();
    } else {
      offMin = parseInt(cmOff.value, 10);
      saveOff();
      cmCustom.hidden = true;
    }
  });

  function readCmCustom() {
    const n = Math.max(1, Math.min(parseInt(cmN.value, 10) || 1, 999));
    const u = parseInt(cmU.value, 10) || 1;
    offMin = Math.min(n * u, 525600);
    saveOff();
  }
  cmN.addEventListener('input', readCmCustom);
  cmU.addEventListener('change', readCmCustom);

  cmGo.addEventListener('click', () => {
    const ids = [];
    for (const cb of cmList.querySelectorAll('input[type=checkbox]')) {
      if (cb.checked) ids.push(cb.dataset.id);
    }
    const sel = items.filter(x => ids.includes(x.id)).sort((a, b) => a.due - b.due);
    if (!sel.length) { toast('请先选择要导入的待办'); return; }

    const now = new Date();
    deliver(buildICS(sel), `TKtodo-${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}.ics`);
    closeCal();
  });

  /* ---------------- 渲染 ---------------- */
  function editorHTML(it) {
    if (renaming) {
      return `<li class="row editing" data-id="${it.id}" data-est="${it.est || 0}">
        <div class="editor">
          <input class="et" type="text" value="${esc(it.title)}" aria-label="任务">
          <div class="eacts">
            <span class="spacer"></span>
            <button class="rename-cancel ghost" type="button">取消</button>
            <button class="rename-ok" type="button">确认</button>
          </div>
        </div>
      </li>`;
    }

    return `<li class="row editing" data-id="${it.id}" data-est="${it.est || 0}">
      <div class="editor">
        <div class="etext">${esc(it.title)}</div>
        <input class="ed" type="text" readonly value="${toInput(it.due).replace('T', ' ')}" data-v="${toInput(it.due)}" aria-label="截止时间">
        <div class="ewd">${wdText(it.due)}</div>
        <div class="est-row">${estBlockHTML(it.est || 0)}</div>
        <div class="eacts">
          <button class="act-rename ghost" type="button">重命名</button>
          <button class="del ghost danger" type="button">删除</button>
          <span class="spacer"></span>
          <button class="cancel ghost" type="button">取消</button>
          <button class="save" type="button">保存</button>
        </div>
      </div>
    </li>`;
  }

  function rowHTML(it, now) {
    if (it.id === editing) return editorHTML(it);

    const over = !it.done && it.due < now;
    const remain = it.due - now;
    const warn = !it.done && !over && it.est && remain < it.est * 60000;
    const cls = over ? ' over' : warn ? ' warn' : (remain <= 86400000 ? ' blue' : '');

    let metaHTML = `<span class="due">${fmt(it.due)}</span>`;
    if (it.done) {
      const late = it.doneAt && it.doneAt > it.due;
      const early = !late && it.doneAt && (it.due - it.doneAt) > 86400000;
      const dcls = late ? ' over' : early ? ' early' : '';
      const label = late ? '逾期' : early ? '提前' : '如期';
      metaHTML += `<span class="left${dcls}">${label}</span>`;
    } else {
      metaHTML += `<span class="left${cls}">${rel(it.due, now)}</span>`;
      if (it.est) metaHTML += `<span class="est${cls}">需 ${dur(it.est)}</span>`;
    }

    const picked = selMode && selIds.has(it.id);
    const left = selMode
      ? `<button class="pick${picked ? ' on' : ''}" type="button" aria-label="${picked ? '取消选择' : '选择'}"><i></i></button>`
      : `<button class="check${it.done ? ' on' : ''}" type="button" aria-label="${it.done ? '取消完成' : '完成'}"><i></i></button>`;

    return `<li class="row${it.done ? ' done' : ''}${over ? ' over' : ''}${picked ? ' sel' : ''}" data-id="${it.id}">
      ${left}
      <div class="txt">
        <div class="title">${esc(it.title)}</div>
        <div class="meta">${metaHTML}</div>
      </div>
    </li>`;
  }

  function render() {
    const now = Date.now();
    const act = items.filter(x => !x.done).sort((a, b) => a.due - b.due);
    const dn = items.filter(x => x.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
    const shown = doneExpanded ? dn : dn.slice(0, DONE_PREVIEW);
    const open = doneBox.open;

    list.innerHTML = act.length
      ? act.map(x => rowHTML(x, now)).join('')
      : '<li class="empty">还没有待办</li>';
    doneList.innerHTML = shown.map(x => rowHTML(x, now)).join('');
    initEstWheels(list);

    doneBox.hidden = dn.length === 0;
    doneBox.open = open;
    summary.textContent = `已完成 ${dn.length}`;
    clearBtn.hidden = dn.length === 0;
    doneSelect.hidden = selMode || dn.length === 0;
    doneMore.hidden = dn.length <= DONE_PREVIEW;
    doneMore.textContent = doneExpanded ? '收起' : `展开全部 ${dn.length} 条`;
    selOpen.hidden = selMode;
    selBar.hidden = !selMode;
    updateSelBar();
    renderTrashCount();
  }

  /* ---------------- 预估时长 ---------------- */

  const estRowEl = $('#estRow');

  function renderEstRow(v) {
    estRowEl.innerHTML = '<span class="est-label">预估</span>' + estBlockHTML(v);
    initEstWheels(estRowEl);
  }

  function setEstValue(group, v) {
    if (group.id === 'estRow') {
      estMin = v;
    } else {
      const row = group.closest('.row');
      if (row) row.dataset.est = String(v);
    }
    const box = group.querySelector('.est-custom');
    if (box) box.dataset.v = String(v);
  }

  document.addEventListener('click', e => {
    const okBtn = e.target.closest('.est-ok');
    if (okBtn) {
      const box = okBtn.closest('.est-custom');
      const group = box.closest('.est-row');
      const v = smallWheelIdx(box.querySelector('.est-h')) * 60 + smallWheelIdx(box.querySelector('.est-m'));
      if (v === 0) {
        toast('预估不能是 0，请拨到至少 1 分钟');
        return;
      }
      setEstValue(group, v);
      box.hidden = true;
      const chipEl = group.querySelector('.chip[data-est="custom"]');
      if (chipEl) {
        chipEl.textContent = dur(v);
        for (const c of group.querySelectorAll('.chip')) c.classList.toggle('on', c === chipEl);
      }
      return;
    }

    const chip = e.target.closest('.chip');
    if (!chip) return;
    const group = chip.closest('.est-row');
    if (!group) return;
    const custom = group.querySelector('.est-custom');

    if (chip.dataset.est === 'custom') {
      if (custom) custom.hidden = false;
      for (const c of group.querySelectorAll('.chip')) c.classList.toggle('on', c === chip);
      initEstWheels(group);

      const hEl = group.querySelector('.est-h');
      const mEl = group.querySelector('.est-m');
      if (hEl && mEl) {
        let cur = parseInt(custom.dataset.v, 10) || 0;
        if (cur === 0) cur = 30;
        setSmallWheel(hEl, Math.floor(cur / 60) % 24);
        setSmallWheel(mEl, cur % 60);
        setEstValue(group, cur);
      }
    } else {
      const v = parseInt(chip.dataset.est, 10) || 0;
      if (custom) custom.hidden = true;
      for (const c of group.querySelectorAll('.chip')) c.classList.toggle('on', parseInt(c.dataset.est, 10) === v);
      const chipCustom = group.querySelector('.chip[data-est="custom"]');
      if (chipCustom) chipCustom.textContent = '自定义';
      setEstValue(group, v);
    }
  });

  /* ---------------- 新增 ---------------- */
  f.addEventListener('submit', e => {
    e.preventDefault();
    const title = t.value.trim() || '新待办';
    const raw = d.dataset.v;
    if (!raw) { openPicker(d); return; }
    const due = new Date(raw).getTime();
    if (!Number.isFinite(due)) { openPicker(d); return; }

    items.push({ id: uid(), title, due, done: false, doneAt: 0, created: Date.now(), est: estMin });
    if (estMin === 0 && estRowEl.querySelector('.chip[data-est="custom"].on')) {
      toast('预估为 0 小时 0 分，已按「无」处理');
    }
    save();
    t.value = '';
    estMin = 0;
    renderEstRow(0);
    applyDue(d, defaultDueMs());
    render();
    // 添加完不再把焦点塞回标题框：手机上会自动弹键盘，等于逼着继续输下一条。
    // 用回车提交时焦点本来还在输入框里，这里也一并收掉。
    if (document.activeElement === t) t.blur();
  });

  function updateWd() {
    const raw = d.dataset.v;
    wd.textContent = raw ? wdText(new Date(raw).getTime()) : '';
  }

  d.addEventListener('click', () => openPicker(d));

  nowBtn.addEventListener('click', () => applyDue(d, Date.now()));

  /* ---------------- 行内交互 ---------------- */
  function onRow(e) {
    const row = e.target.closest('.row');
    if (!row) return;
    const it = items.find(x => x.id === row.dataset.id);
    if (!it) return;

    if (selMode) {
      togglePick(it.id);
      return;
    }

    if (e.target.closest('.act-rename')) {
      renaming = true;
      render();
      const el = list.querySelector('.editor .et');
      if (el) {
        el.focus();
        try { el.setSelectionRange(el.value.length, el.value.length); } catch (err) {}
      }
      return;
    }

    if (e.target.closest('.rename-ok')) {
      const el = row.querySelector('.et');
      const v = el ? el.value.trim() : '';
      it.title = v || '新待办';
      renaming = false;
      save();
      render();
      return;
    }

    if (e.target.closest('.rename-cancel')) {
      renaming = false;
      render();
      return;
    }

    if (e.target.closest('.save')) {
      const el = row.querySelector('.et');
      if (el) {
        const v = el.value.trim();
        if (v) it.title = v;
      }
      const rawDue = row.querySelector('.ed').dataset.v;
      const due = rawDue ? new Date(rawDue).getTime() : NaN;
      if (Number.isFinite(due)) it.due = due;
      it.est = parseInt(row.dataset.est, 10) || 0;
      if (it.est === 0 && row.querySelector('.chip[data-est="custom"].on')) {
        toast('预估为 0 小时 0 分，已按「无」处理');
      }
      save();
      editing = null;
      renaming = false;
      render();
      return;
    }

    if (e.target.closest('.cancel')) {
      editing = null;
      renaming = false;
      render();
      return;
    }

    if (e.target.closest('.del')) {
      askConfirm('删除待办', `确定删除「${it.title}」？\n删除后可以在「最近删除」里恢复。`, '删除').then(ok => {
        if (ok) removeItem(it.id);
      });
      return;
    }

    if (e.target.closest('.editor')) return;

    if (e.target.closest('.check')) {
      it.done = !it.done;
      it.doneAt = it.done ? Date.now() : 0;
      save();
      render();
      return;
    }

    editing = (editing === it.id) ? null : it.id;
    renaming = false;
    render();
  }

  list.addEventListener('click', onRow);
  doneList.addEventListener('click', onRow);

  list.addEventListener('click', e => {
    if (e.target.classList.contains('ed')) openPicker(e.target);
  });

  list.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.classList.contains('et')) {
      e.preventDefault();
      const btn = e.target.closest('.row').querySelector('.rename-ok, .save');
      if (btn) btn.click();
    }
    if (e.key === 'Escape' && e.target.classList.contains('et')) {
      if (renaming) {
        renaming = false;
      } else {
        editing = null;
      }
      render();
    }
  });

  clearBtn.addEventListener('click', () => {
    const n = items.filter(x => x.done).length;
    if (!n) return;
    askConfirm('清空已完成', `将永久删除 ${n} 条已完成的待办，无法恢复。`, '清空').then(ok => {
      if (!ok) return;
      items = items.filter(x => !x.done);
      save();
      render();
    });
  });

  /* ---------------- 最近删除 ---------------- */
  function renderTrashCount() {
    trashOpen.textContent = `最近删除 ${trash.length}`;
  }

  function removeItem(id) {
    const idx = items.findIndex(x => x.id === id);
    if (idx < 0) return;
    const it = items[idx];
    items.splice(idx, 1);
    trash.unshift({ ...it, deletedAt: Date.now() });
    if (trash.length > trashMax) trash = trash.slice(0, trashMax);
    editing = null;
    renaming = false;
    save();
    saveTrash();
    render();
    if (!trashModal.hidden) renderTrash();
  }

  function restoreItem(id) {
    const i = trash.findIndex(x => x.id === id);
    if (i < 0) return;
    const it = { ...trash[i] };
    delete it.deletedAt;
    trash.splice(i, 1);
    items.push(it);
    save();
    saveTrash();
    render();
    renderTrash();
    toast('已恢复「' + it.title + '」');
  }

  function renderTrash() {
    trashMaxEl.value = String(trashMax);
    trashList.innerHTML = trash.length
      ? trash.map(it => `
        <li class="cm-item">
          <div class="trash-row">
            <div class="trash-txt">
              <div class="cm-title">${esc(it.title)}</div>
              <div class="cm-due">${fmt(it.due)}</div>
            </div>
            <button class="trash-restore ghost" type="button" data-id="${it.id}">恢复</button>
            <button class="trash-purge ghost danger" type="button" data-id="${it.id}">彻底删除</button>
          </div>
        </li>`).join('')
      : '<li class="empty">没有最近删除</li>';
    trashClear.disabled = trash.length === 0;
  }

  function openTrash() {
    renderTrash();
    lockScroll(true);
    trashBack.hidden = false;
    trashModal.hidden = false;
  }

  function closeTrash() {
    trashModal.hidden = true;
    trashBack.hidden = true;
    lockScroll(false);
  }

  trashOpen.addEventListener('click', openTrash);
  trashClose.addEventListener('click', closeTrash);
  trashBack.addEventListener('click', closeTrash);

  trashMaxEl.addEventListener('change', () => {
    const v = Math.max(1, Math.min(parseInt(trashMaxEl.value, 10) || 5, 30));
    trashMax = v;
    trashMaxEl.value = String(v);
    localStorage.setItem(TRASHMAX_KEY, String(v));
    if (trash.length > trashMax) { trash = trash.slice(0, trashMax); saveTrash(); }
    renderTrash();
    renderTrashCount();
  });

  trashList.addEventListener('click', e => {
    const r = e.target.closest('.trash-restore');
    if (r) { restoreItem(r.dataset.id); return; }

    const p = e.target.closest('.trash-purge');
    if (p) {
      const it = trash.find(x => x.id === p.dataset.id);
      if (!it) return;
      askConfirm('彻底删除', `「${it.title}」将被永久删除，无法恢复。`, '彻底删除').then(ok => {
        if (!ok) return;
        trash = trash.filter(x => x.id !== it.id);
        saveTrash();
        renderTrash();
        renderTrashCount();
      });
    }
  });

  trashClear.addEventListener('click', () => {
    if (!trash.length) return;
    askConfirm('清空最近删除', `将永久删除最近删除里的 ${trash.length} 条待办，无法恢复。`, '清空').then(ok => {
      if (!ok) return;
      trash = [];
      saveTrash();
      renderTrash();
      renderTrashCount();
    });
  });

  /* ---------------- 多选 ---------------- */
  function updateSelBar() {
    const picked = items.filter(x => selIds.has(x.id));
    const doneN = picked.filter(x => x.done).length;

    selCount.textContent = picked.length
      ? `已选 ${picked.length} 条` + (doneN ? `（其中已完成 ${doneN}）` : '')
      : '点条目选中，可批量完成或删除';
    selDone.hidden = picked.length === doneN;        // 没有未完成的就不显示「完成」
    selUndone.hidden = doneN === 0;
    selAll.textContent = items.length && picked.length === items.length ? '全不选' : '全选';
    selDel.disabled = picked.length === 0;
  }

  // 只改类名不重建列表：重建会让连点丢事件，还会让页面闪一下
  function refreshPicks() {
    for (const row of document.querySelectorAll('.row')) {
      const on = selIds.has(row.dataset.id);
      const btn = row.querySelector('.pick');
      if (!btn) continue;
      btn.classList.toggle('on', on);
      btn.setAttribute('aria-label', on ? '取消选择' : '选择');
      row.classList.toggle('sel', on);
    }
  }

  function togglePick(id) {
    if (selIds.has(id)) selIds.delete(id);
    else selIds.add(id);
    refreshPicks();
    updateSelBar();
  }

  function setSelMode(on) {
    selMode = !!on;
    selIds.clear();
    editing = null;
    renaming = false;
    document.body.classList.toggle('sel', selMode);
    render();
  }

  function bulkSetDone(done) {
    const picked = items.filter(x => selIds.has(x.id) && x.done !== done);
    if (!picked.length) return;
    const now = Date.now();
    for (const it of picked) {
      it.done = done;
      it.doneAt = done ? now : 0;
    }
    save();
    const n = picked.length;
    setSelMode(false);
    toast(done ? `已完成 ${n} 条` : `已取消完成 ${n} 条`);
  }

  function bulkDelete() {
    const picked = items.filter(x => selIds.has(x.id));
    if (!picked.length) return;

    const names = picked.slice(0, 3).map(x => `「${x.title}」`).join('、');
    const body = picked.length > 3
      ? `${names} 等 ${picked.length} 条将移入「最近删除」，可以在那里恢复。`
      : `${names} 将移入「最近删除」，可以在那里恢复。`;

    askConfirm(`删除 ${picked.length} 条待办`, body, '删除').then(ok => {
      if (!ok) return;
      const ids = new Set(picked.map(x => x.id));
      items = items.filter(x => !ids.has(x.id));
      for (const it of picked) trash.unshift({ ...it, deletedAt: Date.now() });
      if (trash.length > trashMax) trash = trash.slice(0, trashMax);
      save();
      saveTrash();
      setSelMode(false);
      toast(`已删除 ${picked.length} 条`);
      if (!trashModal.hidden) renderTrash();
    });
  }

  doneSelect.addEventListener('click', () => setSelMode(true));
  selOpen.addEventListener('click', () => setSelMode(true));
  selExit.addEventListener('click', () => setSelMode(false));
  selAll.addEventListener('click', () => {
    if (selIds.size === items.length) selIds.clear();
    else for (const it of items) selIds.add(it.id);
    refreshPicks();
    updateSelBar();
  });
  selDone.addEventListener('click', () => bulkSetDone(true));
  selUndone.addEventListener('click', () => bulkSetDone(false));
  selDel.addEventListener('click', bulkDelete);
  doneMore.addEventListener('click', () => { doneExpanded = !doneExpanded; render(); });

  /* ---------------- 备份 / 迁移 ----------------
     导出：{ app, v, exportedAt, items, trash, settings }
     导入兼容：上面的对象、只有待办的裸数组、将来加字段的同类对象（多余字段忽略）
     合并 = 按 id 去重后追加；覆盖 = 清空后用文件内容替换，设置也一起恢复。 */
  let bkParsed = null;

  const numOr = (v, d) => { const n = Number(v); return Number.isFinite(n) ? n : d; };

  function normItem(raw) {
    if (!raw || typeof raw !== 'object') return null;
    let due = numOr(raw.due, 0);
    if (!due && typeof raw.due === 'string') due = Date.parse(raw.due) || 0;
    if (!(due > 0)) return null;              // 没有截止时间的条目在这套应用里没有意义
    return {
      id: typeof raw.id === 'string' && raw.id.trim() ? raw.id.trim().slice(0, 64) : uid(),
      title: String(raw.title == null ? '' : raw.title).trim().slice(0, 200) || '新待办',
      due,
      done: !!raw.done,
      doneAt: raw.done ? numOr(raw.doneAt, 0) : 0,
      created: numOr(raw.created, Date.now()),
      est: Math.max(0, Math.min(1440, Math.round(numOr(raw.est, 0)))),
      deletedAt: numOr(raw.deletedAt, 0),
    };
  }

  function normList(arr, seen) {
    const out = [];
    let skipped = 0;
    for (const raw of (Array.isArray(arr) ? arr : [])) {
      const it = normItem(raw);
      if (!it || seen.has(it.id)) { skipped++; continue; }
      seen.add(it.id);
      out.push(it);
    }
    return { out, skipped };
  }

  function parseBackup(text) {
    let data;
    try { data = JSON.parse(text); } catch (e) { return { error: '不是有效的 JSON' }; }
    if (!data || typeof data !== 'object') return { error: '内容不像待办备份' };

    const src = Array.isArray(data) ? { items: data } : data;
    if (!Array.isArray(src.items) && !Array.isArray(src.trash)) {
      return { error: '没找到待办数据' };
    }

    const seen = new Set();
    const a = normList(src.items, seen);
    const b = normList(src.trash, seen);
    const st = (src.settings && typeof src.settings === 'object') ? src.settings : {};

    return {
      items: a.out,
      trash: b.out,
      skipped: a.skipped + b.skipped,
      offMin: Number.isFinite(Number(st.offMin))
        ? Math.max(0, Math.min(525600, Math.round(Number(st.offMin)))) : null,
      trashMax: Number.isFinite(Number(st.trashMax))
        ? Math.max(1, Math.min(30, Math.round(Number(st.trashMax)))) : null,
      when: typeof src.exportedAt === 'string' ? src.exportedAt : '',
    };
  }

  function whenText(iso) {
    const t = Date.parse(iso || '');
    return Number.isFinite(t) ? '导出于 ' + fmt(t) : '';
  }

  function acceptBackup(text) {
    const p = parseBackup(String(text || '').trim());
    if (p.error) {
      bkParsed = null;
      bkPreview.hidden = true;
      toast('导入失败：' + p.error);
      return;
    }
    if (!p.items.length && !p.trash.length) {
      bkParsed = null;
      bkPreview.hidden = true;
      toast('文件里没有可导入的待办');
      return;
    }

    bkParsed = p;
    const dn = p.items.filter(x => x.done).length;
    bkStats2.textContent = `${p.items.length} 条待办（${dn} 已完成）· 最近删除 ${p.trash.length} 条`;
    bkSub.textContent = [whenText(p.when), p.skipped ? `跳过 ${p.skipped} 条无法识别的内容` : '']
      .filter(Boolean).join(' · ');
    bkPreview.hidden = false;
  }

  function applyBackup(mode) {
    const p = bkParsed;
    if (!p) return;

    let added = 0;
    if (mode === 'replace') {
      if (p.trashMax !== null) {
        trashMax = p.trashMax;
        localStorage.setItem(TRASHMAX_KEY, String(trashMax));
      }
      if (p.offMin !== null) {
        offMin = p.offMin;
        saveOff();
      }
      items = p.items.slice();
      trash = p.trash.slice(0, trashMax);
    } else {
      const ids = new Set(items.map(x => x.id));
      for (const it of p.items) {
        if (ids.has(it.id)) continue;
        ids.add(it.id);
        items.push(it);
        added++;
      }
      const tids = new Set(trash.map(x => x.id));
      for (const it of p.trash) {
        if (tids.has(it.id)) continue;
        tids.add(it.id);
        trash.push(it);
      }
      if (trash.length > trashMax) trash = trash.slice(0, trashMax);
    }

    save();
    saveTrash();
    editing = null;
    renaming = false;
    render();
    renderTrashCount();

    if (mode === 'replace') {
      toast(`已覆盖导入 ${p.items.length} 条待办、${p.trash.length} 条最近删除`);
    } else {
      toast(`已合并导入 ${added} 条，跳过 ${p.items.length - added} 条重复`);
    }
    closeBackup();
  }

  function backupText() {
    return JSON.stringify({
      app: 'TKtodo',
      v: 1,
      exportedAt: new Date().toISOString(),
      items,
      trash,
      settings: { offMin, trashMax },
    }, null, 2);
  }

  function backupName() {
    const x = new Date();
    return `TKtodo-${x.getFullYear()}${pad(x.getMonth() + 1)}${pad(x.getDate())}-${pad(x.getHours())}${pad(x.getMinutes())}.json`;
  }

  function saveTextFile(text, name, mime) {
    const blob = new Blob([text], { type: mime + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.rel = 'noopener';
    if (!isIOS()) a.download = name;          // iOS 不认 download，会直接打开内容
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  async function exportBackup() {
    const text = backupText();
    const name = backupName();

    // 手机上有系统分享面板时优先用它：能存进「文件」、发给自己，比下载好找
    try {
      const file = new File([text], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'TKtodo 备份' });
        toast('已导出 ' + name);
        return;
      }
    } catch (err) {
      if (err && err.name === 'AbortError') return;   // 用户自己取消分享
    }

    saveTextFile(text, name, 'application/json');
    toast(isIOS()
      ? '已生成备份文件，请到「文件 → 下载」里查看'
      : '已导出 ' + name);
  }

  function readFileText(file) {
    if (file.text) return file.text();
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result || ''));
      r.onerror = () => rej(r.error);
      r.readAsText(file);
    });
  }

  function openBackup() {
    bkParsed = null;
    bkPreview.hidden = true;
    bkText.value = '';
    bkStats.textContent = `${items.length} 条待办 · ${items.filter(x => x.done).length} 已完成 · 最近删除 ${trash.length} 条`;
    lockScroll(true);
    bkBack.hidden = false;
    bkModal.hidden = false;
  }

  function closeBackup() {
    bkModal.hidden = true;
    bkBack.hidden = true;
    bkParsed = null;
    lockScroll(false);
  }

  bkOpen.addEventListener('click', openBackup);
  bkClose.addEventListener('click', closeBackup);
  bkBack.addEventListener('click', closeBackup);
  bkExport.addEventListener('click', exportBackup);
  bkPick.addEventListener('click', () => bkFile.click());
  bkMerge.addEventListener('click', () => applyBackup('merge'));
  bkReplace.addEventListener('click', () => applyBackup('replace'));

  bkPasteGo.addEventListener('click', () => {
    if (!bkText.value.trim()) { toast('先粘贴备份内容'); return; }
    acceptBackup(bkText.value);
  });

  bkFile.addEventListener('change', async () => {
    const file = bkFile.files && bkFile.files[0];
    if (!file) return;
    try {
      acceptBackup(await readFileText(file));
    } catch (e) {
      toast('读不到这个文件');
    }
    bkFile.value = '';                        // 允许再次选同一个文件
  });

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!bkModal.hidden) { closeBackup(); return; }
    if (selMode) setSelMode(false);
  });

  /* ---------------- 检查更新 ---------------- */
  const updBtn = $('#upd');
  const updBar = $('#updBar');
  const updGo = $('#updGo');
  const updX = $('#updX');
  const UPD_IGNORE_KEY = 'ddl.updignore.v1';
  let remoteBuild = null;
  let autoBusy = false;
  let lastAuto = 0;

  const currentBuild = () => document.querySelector('meta[name="build"]').content;

  async function fetchRemoteBuild() {
    const res = await fetch(location.pathname + '?t=' + Date.now(), { cache: 'no-store' });
    const html = await res.text();
    const m = html.match(/<meta name="build" content="([^"]+)"/);
    return m ? m[1] : null;
  }

  function hideUpdBar() {
    updBar.hidden = true;
  }

  function showUpdBar(build) {
    let ignored = null;
    try { ignored = localStorage.getItem(UPD_IGNORE_KEY); } catch (e) {}
    if (ignored === build) return;
    updBar.hidden = false;
  }

  // 打开时静默检查：有新版本就亮红点 + 底部提示条
  async function autoCheck() {
    if (autoBusy) return;
    autoBusy = true;
    try {
      const b = await fetchRemoteBuild();
      if (b && b !== currentBuild()) {
        remoteBuild = b;
        updBtn.classList.add('has-new');
        updBtn.textContent = '有新版本，点此更新';
        showUpdBar(b);
      }
    } catch (err) {}
    autoBusy = false;
  }

  function maybeAutoCheck() {
    const now = Date.now();
    if (now - lastAuto < 5 * 60000) return;
    lastAuto = now;
    autoCheck();
  }

  async function checkUpdate() {
    updBtn.disabled = true;
    updBtn.textContent = '检查中…';
    try {
      const b = await fetchRemoteBuild();
      if (b && b !== currentBuild()) {
        remoteBuild = b;
        updBtn.textContent = '发现新版本，正在更新…';
        hideUpdBar();
        location.replace(location.pathname + '?v=' + Date.now());
        return;
      }
      updBtn.classList.remove('has-new');
      updBtn.textContent = '已是最新版本';
      hideUpdBar();
      setTimeout(() => {
        updBtn.textContent = '检查更新';
        updBtn.disabled = false;
      }, 1800);
    } catch (err) {
      updBtn.textContent = '检查失败，点此重试';
      updBtn.disabled = false;
    }
  }

  updBtn.addEventListener('click', checkUpdate);

  updGo.addEventListener('click', () => {
    hideUpdBar();
    if (remoteBuild) {
      try { localStorage.setItem(UPD_IGNORE_KEY, remoteBuild); } catch (e) {}
    }
    location.replace(location.pathname + '?v=' + Date.now());
  });

  updX.addEventListener('click', () => {
    hideUpdBar();
    if (remoteBuild) {
      try { localStorage.setItem(UPD_IGNORE_KEY, remoteBuild); } catch (e) {}
      updBtn.classList.remove('has-new');
      updBtn.textContent = '检查更新';
    }
  });

  // 安装成 app 后常常是“恢复”而不是重新加载，所以在回到前台时也查一次
  setTimeout(maybeAutoCheck, 1000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') setTimeout(maybeAutoCheck, 600);
  });

  applyDue(d, defaultDueMs());
  renderEstRow(0);
  document.getElementById('buildTag').textContent = 'v ' + currentBuild();
  render();
  setInterval(() => { if (!editing) render(); }, 60000);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
